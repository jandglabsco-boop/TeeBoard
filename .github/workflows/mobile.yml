name: Build mobile apps

# Builds the iOS and Android apps from the same source the website uses.
# Runs on GitHub's macOS runners, which have Xcode preinstalled — so no local
# Xcode is needed.
on:
  push:
    branches: [main]
    paths:
      - "index.html"
      - "app.js"
      - "config.js"
      - "sw.js"
      - "manifest.webmanifest"
      - "icons/**"
      - "ios/**"
      - "android/**"
      - "capacitor.config.json"
      - "package.json"
      - ".github/workflows/mobile.yml"
  workflow_dispatch:        # lets you build on demand from the Actions tab

jobs:
  ios:
    name: iOS
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Build web assets and sync to native project
        run: |
          npm run build
          npx cap sync ios

      - name: Install CocoaPods dependencies
        working-directory: ios/App
        run: pod install --repo-update

      # Compiles without any certificates. This proves the app builds; it
      # can't be installed on a device, which is what the signed job below is
      # for. Kept separate so a missing certificate never hides a real
      # compile error.
      - name: Build (unsigned)
        run: |
          xcodebuild \
            -workspace ios/App/App.xcworkspace \
            -scheme App \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build

      # Signing and upload use an App Store Connect API key. Xcode creates and
      # renews the certificate and provisioning profile itself, so there is no
      # CSR to generate, no .p12 to export, and no Transporter step. One key
      # replaces the whole manual dance.
      - name: Check for App Store Connect API key
        id: signing
        env:
          KEY: ${{ secrets.APPSTORE_API_KEY_P8 }}
        run: |
          if [ -n "$KEY" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice::No App Store Connect API key set - built unsigned only. See MOBILE.md."
          fi

      - name: Install API key
        if: steps.signing.outputs.ready == 'true'
        env:
          KEY_P8: ${{ secrets.APPSTORE_API_KEY_P8 }}
          KEY_ID: ${{ secrets.APPSTORE_API_KEY_ID }}
        run: |
          mkdir -p ~/private_keys
          # The filename must follow AuthKey_<KEYID>.p8 for xcodebuild to find it.
          KEY_FILE=~/private_keys/AuthKey_$KEY_ID.p8

          # Accept the secret either way: pasted straight out of the .p8 (so it
          # still has the PEM header) or base64-encoded. Both are reasonable
          # things to have put in the box, and a wrong guess here fails with an
          # opaque "error decoding base64 input stream".
          if printf '%s' "$KEY_P8" | grep -q 'BEGIN PRIVATE KEY'; then
            printf '%s\n' "$KEY_P8" > "$KEY_FILE"
            echo "Key stored as PEM."
          else
            # Tolerate whitespace/newlines from clipboard wrapping.
            printf '%s' "$KEY_P8" | tr -d '[:space:]' | base64 --decode > "$KEY_FILE"
            echo "Key decoded from base64."
          fi
          chmod 600 "$KEY_FILE"

          # Fail here, loudly, rather than 20 minutes later inside xcodebuild.
          if ! grep -q 'BEGIN PRIVATE KEY' "$KEY_FILE"; then
            echo "::error::APPSTORE_API_KEY_P8 is not a valid .p8 key. Re-add it with: openssl base64 -A -in AuthKey_XXXX.p8 | pbcopy"
            exit 1
          fi
          if ! openssl pkey -in "$KEY_FILE" -noout 2>/dev/null; then
            echo "::error::APPSTORE_API_KEY_P8 decoded but is not a readable private key - it may be truncated."
            exit 1
          fi
          echo "API key validated."

      - name: Archive with automatic signing
        if: steps.signing.outputs.ready == 'true'
        env:
          KEY_ID: ${{ secrets.APPSTORE_API_KEY_ID }}
          ISSUER_ID: ${{ secrets.APPSTORE_API_ISSUER_ID }}
          TEAM_ID: ${{ secrets.APPSTORE_TEAM_ID }}
        run: |
          # -allowProvisioningUpdates lets Xcode register the bundle id, issue
          # the distribution certificate and create the profile on demand.
          xcodebuild \
            -workspace ios/App/App.xcworkspace \
            -scheme App \
            -configuration Release \
            -sdk iphoneos \
            -archivePath "$RUNNER_TEMP/TeeBoard.xcarchive" \
            -allowProvisioningUpdates \
            -authenticationKeyPath ~/private_keys/AuthKey_$KEY_ID.p8 \
            -authenticationKeyID "$KEY_ID" \
            -authenticationKeyIssuerID "$ISSUER_ID" \
            DEVELOPMENT_TEAM="$TEAM_ID" \
            CODE_SIGN_STYLE=Automatic \
            archive

      - name: Export .ipa
        if: steps.signing.outputs.ready == 'true'
        env:
          KEY_ID: ${{ secrets.APPSTORE_API_KEY_ID }}
          ISSUER_ID: ${{ secrets.APPSTORE_API_ISSUER_ID }}
          TEAM_ID: ${{ secrets.APPSTORE_TEAM_ID }}
        run: |
          cat > /tmp/ExportOptions.plist <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store</string>
            <key>teamID</key><string>${TEAM_ID}</string>
            <key>signingStyle</key><string>automatic</string>
            <key>uploadSymbols</key><true/>
          </dict>
          </plist>
          PLIST

          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/TeeBoard.xcarchive" \
            -exportOptionsPlist /tmp/ExportOptions.plist \
            -exportPath "$RUNNER_TEMP/export" \
            -allowProvisioningUpdates \
            -authenticationKeyPath ~/private_keys/AuthKey_$KEY_ID.p8 \
            -authenticationKeyID "$KEY_ID" \
            -authenticationKeyIssuerID "$ISSUER_ID"

      - name: Upload to TestFlight
        if: steps.signing.outputs.ready == 'true'
        env:
          KEY_ID: ${{ secrets.APPSTORE_API_KEY_ID }}
          ISSUER_ID: ${{ secrets.APPSTORE_API_ISSUER_ID }}
        run: |
          IPA=$(find "$RUNNER_TEMP/export" -name "*.ipa" | head -1)
          echo "Uploading $IPA"
          # Goes straight to App Store Connect; no Transporter needed.
          xcrun altool --upload-app -f "$IPA" -t ios \
            --apiKey "$KEY_ID" --apiIssuer "$ISSUER_ID"

      - name: Upload .ipa artifact
        if: steps.signing.outputs.ready == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: TeeBoard-ios-ipa
          path: ${{ runner.temp }}/export/*.ipa
          if-no-files-found: error
          retention-days: 30

      - name: Clean up API key
        if: always()
        run: rm -rf ~/private_keys

  android:
    name: Android
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install dependencies
        run: npm ci

      - name: Build web assets and sync to native project
        run: |
          npm run build
          npx cap sync android

      # A debug APK needs no certificates and installs straight onto any
      # Android phone, so there's something testable from the first run.
      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: TeeBoard-android-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30
