name: Build mobile apps

# Builds the iOS and Android apps from the same source the website uses.
# Runs on GitHub's macOS runners, which have Xcode preinstalled — so no local
# Xcode is needed.
on:
  push:
    branches: [main]
    paths:
      - "index.html"
      - "app.js"
      - "config.js"
      - "sw.js"
      - "manifest.webmanifest"
      - "icons/**"
      - "ios/**"
      - "android/**"
      - "capacitor.config.json"
      - "package.json"
      - ".github/workflows/mobile.yml"
  workflow_dispatch:        # lets you build on demand from the Actions tab

jobs:
  ios:
    name: iOS
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Build web assets and sync to native project
        run: |
          npm run build
          npx cap sync ios

      - name: Install CocoaPods dependencies
        working-directory: ios/App
        run: pod install --repo-update

      # Compiles without any certificates. This proves the app builds; it
      # can't be installed on a device, which is what the signed job below is
      # for. Kept separate so a missing certificate never hides a real
      # compile error.
      - name: Build (unsigned)
        run: |
          xcodebuild \
            -workspace ios/App/App.xcworkspace \
            -scheme App \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build

      # Signing and upload use an App Store Connect API key. Xcode creates and
      # renews the certificate and provisioning profile itself, so there is no
      # CSR to generate, no .p12 to export, and no Transporter step. One key
      # replaces the whole manual dance.
      - name: Check for App Store Connect API key
        id: signing
        env:
          KEY: ${{ secrets.APPSTORE_API_KEY_P8 }}
        run: |
          if [ -n "$KEY" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice::No App Store Connect API key set - built unsigned only. See MOBILE.md."
          fi

      - name: Install API key
        if: steps.signing.outputs.ready == 'true'
        env:
          KEY_P8: ${{ secrets.APPSTORE_API_KEY_P8 }}
          KEY_ID: ${{ secrets.APPSTORE_API_KEY_ID }}
        run: |
          mkdir -p ~/private_keys
          # The filename must follow AuthKey_<KEYID>.p8 for xcodebuild to find it.
          KEY_FILE=~/private_keys/AuthKey_$KEY_ID.p8

          # Shape of the secret only - no key material. A real .p8 is ~240
          # bytes of PEM, or ~330 chars once base64'd; anything much shorter
          # means the wrong value landed in the box.
          echo "Secret length: $(printf '%s' "$KEY_P8" | wc -c | tr -d ' ') bytes, $(printf '%s' "$KEY_P8" | wc -l | tr -d ' ') newlines"
          printf '%s' "$KEY_P8" | grep -q 'BEGIN'   && echo "contains BEGIN: yes"   || echo "contains BEGIN: no"
          printf '%s' "$KEY_P8" | grep -q 'PRIVATE' && echo "contains PRIVATE: yes" || echo "contains PRIVATE: no"
          BAD=$(printf '%s' "$KEY_P8" | tr -d '[:space:]' | tr -d 'A-Za-z0-9+/=' | wc -c | tr -d ' ')
          echo "chars outside the base64 alphabet: $BAD"

          # Accept the secret either way: pasted straight out of the .p8 (so it
          # still has the PEM header) or base64-encoded. Both are reasonable
          # things to have put in the box, and a wrong guess here fails with an
          # opaque "error decoding base64 input stream".
          if printf '%s' "$KEY_P8" | grep -q 'BEGIN PRIVATE KEY'; then
            printf '%s\n' "$KEY_P8" > "$KEY_FILE"
            echo "Key stored as PEM."
          else
            # Tolerate whitespace/newlines from clipboard wrapping.
            printf '%s' "$KEY_P8" | tr -d '[:space:]' | base64 --decode > "$KEY_FILE"
            echo "Key decoded from base64."
          fi
          chmod 600 "$KEY_FILE"

          # Fail here, loudly, rather than 20 minutes later inside xcodebuild.
          if ! grep -q 'BEGIN PRIVATE KEY' "$KEY_FILE"; then
            # The commonest mistake by far: the Key ID pasted into the key box.
            # They sit next to each other on Apple's page and read alike.
            if printf '%s' "$KEY_P8" | grep -qE '^[A-Z0-9]{8,12}$'; then
              echo "::error::APPSTORE_API_KEY_P8 contains a short ID, not a key. It needs the *contents of the .p8 file* (~340 chars). The ID belongs in APPSTORE_API_KEY_ID. Fix with: bash tools/setup-appstore-secrets.sh"
            else
              echo "::error::APPSTORE_API_KEY_P8 is not a valid .p8 key. Fix with: bash tools/setup-appstore-secrets.sh"
            fi
            exit 1
          fi
          if ! openssl pkey -in "$KEY_FILE" -noout 2>/dev/null; then
            echo "::error::APPSTORE_API_KEY_P8 decoded but is not a readable private key - it may be truncated."
            exit 1
          fi
          echo "API key validated."

      # Ask Apple whether the credentials actually work, before xcodebuild
      # spends twenty minutes to report the same thing as an opaque 401
      # buried in provisioning output.
      - name: Check credentials against Apple
        if: steps.signing.outputs.ready == 'true'
        env:
          KEY_ID: ${{ secrets.APPSTORE_API_KEY_ID }}
          ISSUER_ID: ${{ secrets.APPSTORE_API_ISSUER_ID }}
          TEAM_ID: ${{ secrets.APPSTORE_TEAM_ID }}
        run: |
          pip3 install --quiet --disable-pip-version-check pyjwt cryptography
          python3 - <<'PY'
          import os, sys, time, json, urllib.request, urllib.error, jwt

          key_id, issuer, team = os.environ["KEY_ID"], os.environ["ISSUER_ID"], os.environ["TEAM_ID"]
          key = open(os.path.expanduser(f"~/private_keys/AuthKey_{key_id}.p8")).read()

          print(f"Key ID    : {len(key_id)} chars")
          print(f"Issuer ID : {len(issuer)} chars, {'looks like a UUID' if issuer.count('-') == 4 else 'NOT UUID-shaped'}")
          print(f"Team ID   : {len(team)} chars" + ("" if len(team) == 10 else "  <-- Apple team IDs are 10 characters"))

          token = jwt.encode(
              {"iss": issuer, "iat": int(time.time()), "exp": int(time.time()) + 900,
               "aud": "appstoreconnect-v1"},
              key, algorithm="ES256", headers={"kid": key_id, "typ": "JWT"})

          def call(path):
              req = urllib.request.Request(
                  "https://api.appstoreconnect.apple.com/v1/" + path,
                  headers={"Authorization": "Bearer " + token})
              try:
                  with urllib.request.urlopen(req) as r:
                      return r.status, json.load(r)
              except urllib.error.HTTPError as e:
                  return e.code, e.read().decode()[:400]

          status, body = call("apps?limit=200")
          if status == 401:
              print("::error::Apple rejected the credentials (401). The key and Issuer ID do not "
                    "match, or the key has been revoked. Both are on "
                    "https://appstoreconnect.apple.com/access/integrations/api - the Issuer ID is "
                    "at the top of the page, above the key list.")
              sys.exit(1)
          if status != 200:
              print(f"::error::App Store Connect returned {status}: {body}")
              sys.exit(1)

          print("\nCredentials accepted by Apple.")
          apps = {a["attributes"]["bundleId"]: a["attributes"]["name"] for a in body["data"]}
          print(f"Apps visible to this key: {len(apps)}")
          for bid, name in sorted(apps.items()):
              print(f"  {bid}  ({name})")

          want = "com.jandglabs.teeboard"
          if want not in apps:
              print(f"::error::No app record for {want}. Create it at "
                    "https://appstoreconnect.apple.com/apps - My Apps, +, New App - or, if it "
                    "exists, give this API key access to it under Users and Access.")
              sys.exit(1)
          print(f"\nFound the app record for {want}.")
          PY

      - name: Archive with automatic signing
        if: steps.signing.outputs.ready == 'true'
        env:
          KEY_ID: ${{ secrets.APPSTORE_API_KEY_ID }}
          ISSUER_ID: ${{ secrets.APPSTORE_API_ISSUER_ID }}
          TEAM_ID: ${{ secrets.APPSTORE_TEAM_ID }}
        run: |
          # -allowProvisioningUpdates lets Xcode register the bundle id, issue
          # the distribution certificate and create the profile on demand.
          xcodebuild \
            -workspace ios/App/App.xcworkspace \
            -scheme App \
            -configuration Release \
            -sdk iphoneos \
            -archivePath "$RUNNER_TEMP/TeeBoard.xcarchive" \
            -allowProvisioningUpdates \
            -authenticationKeyPath ~/private_keys/AuthKey_$KEY_ID.p8 \
            -authenticationKeyID "$KEY_ID" \
            -authenticationKeyIssuerID "$ISSUER_ID" \
            DEVELOPMENT_TEAM="$TEAM_ID" \
            CODE_SIGN_STYLE=Automatic \
            archive

      - name: Export .ipa
        if: steps.signing.outputs.ready == 'true'
        env:
          KEY_ID: ${{ secrets.APPSTORE_API_KEY_ID }}
          ISSUER_ID: ${{ secrets.APPSTORE_API_ISSUER_ID }}
          TEAM_ID: ${{ secrets.APPSTORE_TEAM_ID }}
        run: |
          cat > /tmp/ExportOptions.plist <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store</string>
            <key>teamID</key><string>${TEAM_ID}</string>
            <key>signingStyle</key><string>automatic</string>
            <key>uploadSymbols</key><true/>
          </dict>
          </plist>
          PLIST

          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/TeeBoard.xcarchive" \
            -exportOptionsPlist /tmp/ExportOptions.plist \
            -exportPath "$RUNNER_TEMP/export" \
            -allowProvisioningUpdates \
            -authenticationKeyPath ~/private_keys/AuthKey_$KEY_ID.p8 \
            -authenticationKeyID "$KEY_ID" \
            -authenticationKeyIssuerID "$ISSUER_ID"

      - name: Upload to TestFlight
        if: steps.signing.outputs.ready == 'true'
        env:
          KEY_ID: ${{ secrets.APPSTORE_API_KEY_ID }}
          ISSUER_ID: ${{ secrets.APPSTORE_API_ISSUER_ID }}
        run: |
          IPA=$(find "$RUNNER_TEMP/export" -name "*.ipa" | head -1)
          echo "Uploading $IPA"
          # Goes straight to App Store Connect; no Transporter needed.
          xcrun altool --upload-app -f "$IPA" -t ios \
            --apiKey "$KEY_ID" --apiIssuer "$ISSUER_ID"

      - name: Upload .ipa artifact
        if: steps.signing.outputs.ready == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: TeeBoard-ios-ipa
          path: ${{ runner.temp }}/export/*.ipa
          if-no-files-found: error
          retention-days: 30

      - name: Clean up API key
        if: always()
        run: rm -rf ~/private_keys

  android:
    name: Android
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install dependencies
        run: npm ci

      - name: Build web assets and sync to native project
        run: |
          npm run build
          npx cap sync android

      # A debug APK needs no certificates and installs straight onto any
      # Android phone, so there's something testable from the first run.
      # Retried because the Gradle distribution download resets often enough
      # on hosted runners to fail an otherwise-fine build.
      - name: Build debug APK
        working-directory: android
        run: |
          for attempt in 1 2 3; do
            if ./gradlew assembleDebug --no-daemon; then
              exit 0
            fi
            echo "::warning::Gradle attempt $attempt failed; retrying in 20s"
            sleep 20
          done
          echo "::error::Gradle failed three times - this is a real build failure, not a flake."
          exit 1

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: TeeBoard-android-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30
