<html lang="en">
<head>

<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
<title>TeeBoard</title>

<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
  :root {
    /* --blue/--blue-dark names are historical; the accent is now the
       brand green from the TeeBoard logo. Kept the variable names to
       avoid touching every rule that references them. */
    --ink: #16231d;
    --blue: #2fa84f;
    --blue-dark: #1c7a3a;
    --line: #e7e8f0;
    --paper: #f6f7fb;
    --ink-soft: #6b7280;
  }
  * { -webkit-tap-highlight-color: transparent; }
  body {
    font-family: 'Manrope', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    -webkit-font-smoothing: antialiased;
    background: radial-gradient(1100px 520px at 50% -12%, #e9f7ec 0%, var(--paper) 55%, var(--paper) 100%);
    background-attachment: fixed;
  }
  h1, h2, h3 { letter-spacing: -0.02em; }
  .brand { font-family: 'Fraunces', serif; letter-spacing: -0.01em; }

  .wordmark { font-family: 'Manrope', sans-serif; font-weight: 800; letter-spacing: .02em; }
  .wordmark .wm-tee { color: var(--blue); }
  .wordmark .wm-board { color: var(--ink); }
  .wordmark.on-dark .wm-board { color: #ffffff; }

  .card {
    background: #fff;
    border: 1px solid var(--line);
    border-radius: 1.35rem;
    box-shadow: 0 1px 2px rgba(15,23,42,.04);
  }

  input, select {
    border: 1px solid var(--line);
    border-radius: .9rem;
    padding: .75rem .9rem;
    width: 100%;
    font-size: 1rem;
    background: #fff;
    color: var(--ink);
    transition: border-color .15s ease, box-shadow .15s ease;
  }
  input::placeholder { color: #a3a9b8; }
  input:focus, select:focus {
    outline: none;
    border-color: var(--blue);
    box-shadow: 0 0 0 3px rgba(47,168,79,.16);
  }

  button { cursor: pointer; font-family: inherit; }

  .btn-primary {
    background: linear-gradient(135deg, #3fbf63, var(--blue-dark));
    color: white;
    border-radius: 1rem;
    padding: .8rem 1.25rem;
    font-weight: 700;
    letter-spacing: .01em;
    box-shadow: 0 8px 18px -8px rgba(28,122,58,.55);
    transition: transform .15s ease, box-shadow .15s ease;
  }
  .btn-primary:hover { transform: translateY(-1px); box-shadow: 0 12px 22px -8px rgba(28,122,58,.6); }
  .btn-primary:active { transform: translateY(0); }
  .btn-primary:disabled { opacity: .5; cursor: not-allowed; transform: none; box-shadow: none; }

  .btn-secondary {
    background: #fff;
    color: var(--ink);
    border: 1px solid var(--line);
    border-radius: 1rem;
    padding: .8rem 1.25rem;
    font-weight: 700;
    transition: background .15s ease, border-color .15s ease;
  }
  .btn-secondary:hover { background: #f3f4f8; }

  .btn-ghost { color: var(--blue); font-weight: 700; }
  .btn-ghost:hover { color: var(--blue-dark); }

  .score-btn {
    width: 3rem; height: 3rem;
    border-radius: 9999px;
    font-weight: 800;
    font-size: 1.2rem;
    border: 1px solid var(--line);
    background: #fff;
    transition: transform .1s ease, background .15s ease;
  }
  .score-btn:active { transform: scale(.9); background: #eaf7ee; }

  .search-result:hover { background: #eefaf1; }

  .icon-badge {
    width: 2.9rem; height: 2.9rem;
    min-width: 2.9rem;
    border-radius: 1rem;
    display: flex; align-items: center; justify-content: center;
    font-size: 1.4rem;
    background: linear-gradient(135deg, rgba(47,168,79,.16), rgba(47,168,79,.05));
  }

  .rank-badge {
    display: inline-flex; align-items: center; justify-content: center;
    width: 1.8rem; height: 1.8rem; border-radius: 9999px;
    font-weight: 800; font-size: .78rem;
    background: #eef1f8; color: var(--ink-soft);
  }
  .rank-badge.gold { background: #fbecc4; color: #8a6300; }

  .par-chip {
    display: inline-block;
    padding: .2rem .6rem;
    border-radius: 9999px;
    font-weight: 800;
  }
  .par-chip.under { background: #e6f7ea; color: var(--blue-dark); }
  .par-chip.flat { background: #f3f4f8; color: #475569; }

  .hole-mark {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 2.4rem;
    height: 2.4rem;
    min-width: 2.4rem;
    font-weight: 800;
    font-size: 1.05rem;
    border-radius: 9999px;
    background: #f3f4f8;
    color: var(--ink);
    border: 2.5px solid transparent;
  }
  .hole-mark.birdie { background: transparent; border-color: var(--blue-dark); color: var(--blue-dark); }
  .hole-mark.eagle { background: transparent; border-color: var(--blue-dark); color: var(--blue-dark); outline: 2px solid var(--blue-dark); outline-offset: 2px; }
  .hole-mark.bogey { background: transparent; border-radius: .55rem; border-color: #475569; color: #475569; }
  .hole-mark.double-bogey { background: transparent; border-radius: .55rem; border-color: #475569; color: #475569; outline: 2px solid #475569; outline-offset: 2px; }
  .hole-mark-sm { width: 1.9rem; height: 1.9rem; min-width: 1.9rem; font-size: .85rem; }

  .fin-badge {
    display: inline-block;
    padding: .05rem .4rem;
    border-radius: 9999px;
    font-weight: 800;
    font-size: .68rem;
    background: #dcfce7;
    color: #15803d;
    vertical-align: middle;
  }

  @media print {
    body * { visibility: hidden; }
    #qr-print-area, #qr-print-area * { visibility: visible; }
    #qr-print-area {
      position: fixed;
      inset: 0;
      margin: 0;
      border: none;
      box-shadow: none;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
    }
    #qr-print-area canvas { margin: 1.5rem auto; }
    .no-print { display: none !important; }
  }
</style>
</head>
<body class="min-h-screen text-gray-900">

        <circle cx="50" cy="17" r="7" fill="none" stroke="#ffffff" stroke-width="4" />
        <rect x="14" y="20" width="72" height="46" rx="9" fill="none" stroke="#ffffff" stroke-width="4" />
        <line x1="14" y1="35" x2="86" y2="35" stroke="#ffffff" stroke-width="2.5" />

</html>
